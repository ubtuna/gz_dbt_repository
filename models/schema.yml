 # schema.yml
version: 2
sources:
- name: raw
  schema: gz_raw_data
  tables:
    - name: sales
      identifier: raw_gz_sales
      description: sales of Greenweez / we have one row per product_id found in each each orders_id
      columns:
        - name: date_date
          description: date of purchase
        - name: orders_id
          description: foreign key to ship
        - name: products_id
          description: foreign key to product   
        - name: revenue
          description: the amount paid by the customer to purchase the product. revenue= quantity * selling_price
        - name: quantity
          description: the quantity of the products purchased for a given order
          tests:
            - unique:
               column_name: "(orders_id || '-' || products_id)"
            


            

          
    - name: product
      identifier: raw_gz_product
      description: products of Greenweez
      columns:
        - name: products_id
          description: Primary key
          tests:
             - unique
             - not_null
             
        
        - name: purchase_price
          description: the purchase of product

    - name: ship
      identifier: raw_gz_ship
      description: shipping data for Greenweez
      columns:
        - name: orders_id
          description: Primary key
          tests:
            - unique
            - not_null
            
        - name: shipping_fee
          description: the price the customers pays for shipping
        - name: log_cost
          description: the cost of preparing parcel in the distrubition centre/warehouse
        - name: ship_cost 
          description: shipping cost paid by Greenweez to the carrier/logistics provider

